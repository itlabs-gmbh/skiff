# Spike: managed-identity endpoint that answers with a static placeholder.
# No az call on the Mac; real tokens are injected by the intercepting proxy.
#   make-placeholder.sh > /tmp/claude-501/azspike/placeholder.json

name = "azure-mi"
description = "static Azure managed-identity placeholder (spike)"

[exec]
command = "cat"
args = ["/tmp/claude-501/azspike/placeholder.json"]

[guest.env]
IDENTITY_ENDPOINT = "{{ .BrokerURL }}/azure-mi"
IDENTITY_HEADER = "{{ .PseudoToken }}"
