# Spike: Azure DevOps through intercept routes with an Entra token minted by
# az on the Mac (resource 499b84ac-1321-427f-aa17-267ca6975798 is Azure
# DevOps). No PAT, no insteadOf: git, az devops and REST clients in the guest
# use the real https://dev.azure.com URLs.

name = "ado-spike"
description = "Azure DevOps via intercept routes with an Entra token (spike)"

[proxy]
upstream = "https://dev.azure.com"
[proxy.headers]
Authorization = "Bearer {{ secret \"cmd:az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv\" }}"

# Repos (git), REST, az devops.
[[proxy.routes]]
host = "dev.azure.com"
intercept = true
[proxy.routes.headers]
Authorization = "Bearer {{ secret \"cmd:az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv\" }}"

# Identities, used by some az devops commands.
[[proxy.routes]]
host = "vssps.dev.azure.com"
intercept = true
[proxy.routes.headers]
Authorization = "Bearer {{ secret \"cmd:az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv\" }}"

# Artifacts: feed management and package downloads.
[[proxy.routes]]
host = "feeds.dev.azure.com"
intercept = true
[proxy.routes.headers]
Authorization = "Bearer {{ secret \"cmd:az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv\" }}"

[[proxy.routes]]
host = "pkgs.dev.azure.com"
intercept = true
[proxy.routes.headers]
Authorization = "Bearer {{ secret \"cmd:az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv\" }}"
